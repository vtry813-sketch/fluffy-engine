<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILAL-MD | Pair Code</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #050810;
      --card: #0d1117;
      --border: rgba(99, 102, 241, 0.25);
      --primary: #6366f1;
      --primary-light: #818cf8;
      --accent: #22d3ee;
      --accent2: #a855f7;
      --success: #10b981;
      --danger: #ef4444;
      --text: #f1f5f9;
      --muted: #64748b;
      --mono: 'JetBrains Mono', monospace;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      background: var(--bg);
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    .bg-mesh { position: fixed; inset: 0; z-index: 0; overflow: hidden; }
    .bg-mesh::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%);
      top: -200px; left: -200px;
      animation: drift1 12s ease-in-out infinite alternate;
    }
    .bg-mesh::after {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: radial-gradient(circle, rgba(168,85,247,0.10) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      animation: drift2 15s ease-in-out infinite alternate;
    }
    @keyframes drift1 { to { transform: translate(80px, 60px); } }
    @keyframes drift2 { to { transform: translate(-60px, -80px); } }
    .scanlines {
      position: fixed; inset: 0; z-index: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.025) 2px, rgba(0,0,0,0.025) 4px);
      pointer-events: none;
    }
    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      opacity: 0.12; animation: orbFloat linear infinite; pointer-events: none; z-index: 0;
    }
    @keyframes orbFloat { 0% { transform: translateY(110vh); } 100% { transform: translateY(-20vh); } }
    .wrapper { position: relative; z-index: 10; width: 100%; max-width: 460px; padding: 20px; }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3);
      border-radius: 100px; padding: 6px 16px;
      font-size: 12px; font-weight: 600; color: var(--success);
      letter-spacing: 1px; text-transform: uppercase; margin-bottom: 20px;
      font-family: var(--mono);
    }
    .status-dot {
      width: 7px; height: 7px; background: var(--success);
      border-radius: 50%; animation: blink 1.5s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity:1; box-shadow: 0 0 6px var(--success); }
      50% { opacity:0.3; box-shadow: none; }
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.03), 0 24px 64px rgba(0,0,0,0.6), 0 0 80px rgba(99,102,241,0.04);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, var(--primary), var(--accent2), var(--accent));
    }
    .card::after {
      content: ''; position: absolute; top: -60px; right: -60px;
      width: 160px; height: 160px;
      background: radial-gradient(circle, rgba(99,102,241,0.07), transparent 70%);
      border-radius: 50%;
    }
    .brand { text-align: center; margin-bottom: 32px; }
    .brand-logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--primary), var(--accent2));
      border-radius: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 28px; margin-bottom: 14px;
      box-shadow: 0 8px 28px rgba(99,102,241,0.35), 0 0 0 1px rgba(255,255,255,0.08);
    }
    .brand-name {
      font-size: 26px; font-weight: 700;
      background: linear-gradient(135deg, #fff 0%, var(--primary-light) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }
    .brand-desc { font-size: 13px; color: var(--muted); }
    .divider { height: 1px; background: linear-gradient(90deg, transparent, var(--border), transparent); margin: 24px 0; }
    .field-label {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1.5px; color: var(--muted); margin-bottom: 10px;
      display: flex; align-items: center; gap: 8px;
    }
    .field-label i { color: var(--primary-light); }
    .input-group {
      display: flex;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 14px; overflow: hidden;
      transition: all 0.3s; margin-bottom: 14px;
    }
    .input-group:focus-within {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99,102,241,0.15);
    }
    .input-prefix {
      padding: 0 16px; display: flex; align-items: center;
      background: rgba(99,102,241,0.08);
      border-right: 1px solid rgba(255,255,255,0.06);
      color: var(--primary-light); font-family: var(--mono);
      font-size: 16px; font-weight: 700;
    }
    .input-group input {
      flex: 1; background: transparent; border: none;
      padding: 16px 18px; color: var(--text);
      font-family: var(--mono); font-size: 15px;
      font-weight: 500; outline: none; letter-spacing: 1px;
    }
    .input-group input::placeholder { color: rgba(255,255,255,0.18); letter-spacing: 0; font-family: 'Space Grotesk', sans-serif; }
    .btn-pair {
      width: 100%; padding: 16px;
      background: linear-gradient(135deg, var(--primary) 0%, var(--accent2) 100%);
      border: none; border-radius: 14px; color: white;
      font-family: 'Space Grotesk', sans-serif; font-size: 15px;
      font-weight: 700; letter-spacing: 0.3px; cursor: pointer;
      transition: all 0.3s; position: relative; overflow: hidden;
      display: flex; align-items: center; justify-content: center; gap: 10px;
    }
    .btn-pair:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(99,102,241,0.4); }
    .btn-pair:active { transform: translateY(0); }
    .btn-pair.loading { pointer-events: none; opacity: 0.7; }
    #result-area { margin-top: 18px; }
    .loading-state {
      display: flex; align-items: center; gap: 12px;
      background: rgba(99,102,241,0.06);
      border: 1px solid rgba(99,102,241,0.15);
      border-radius: 12px; padding: 15px 18px;
      color: var(--primary-light); font-size: 13.5px; font-weight: 500;
    }
    .spinner {
      width: 18px; height: 18px;
      border: 2px solid rgba(99,102,241,0.2);
      border-top-color: var(--primary-light);
      border-radius: 50%; animation: spin 0.8s linear infinite; flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .code-card {
      background: rgba(0,0,0,0.3);
      border: 1px solid rgba(34,211,238,0.2);
      border-radius: 16px; padding: 28px 24px; text-align: center;
      animation: fadeSlideIn 0.4s ease;
    }
    @keyframes fadeSlideIn { from { opacity:0; transform: translateY(12px); } to { opacity:1; transform: translateY(0); } }
    .code-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--muted); margin-bottom: 14px; }
    .code-value {
      font-family: var(--mono); font-size: 32px; font-weight: 700;
      color: var(--accent); text-shadow: 0 0 24px rgba(34,211,238,0.4);
      letter-spacing: 8px; margin-bottom: 18px; display: block;
    }
    .btn-copy {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(34,211,238,0.1);
      border: 1px solid rgba(34,211,238,0.25);
      border-radius: 100px; padding: 9px 22px;
      color: var(--accent); font-size: 13px; font-weight: 600;
      cursor: pointer; transition: all 0.2s;
      font-family: 'Space Grotesk', sans-serif;
    }
    .btn-copy:hover { background: rgba(34,211,238,0.18); transform: translateY(-1px); box-shadow: 0 4px 12px rgba(34,211,238,0.2); }
    .code-hint {
      margin-top: 14px; font-size: 12px; color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .error-state {
      background: rgba(239,68,68,0.06);
      border: 1px solid rgba(239,68,68,0.2);
      border-radius: 12px; padding: 14px 18px;
      display: flex; align-items: center; gap: 12px;
      font-size: 13px; color: #fca5a5;
      animation: fadeSlideIn 0.3s ease;
    }
    .steps { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
    .step {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 13px 15px;
      background: rgba(255,255,255,0.02);
      border: 1px solid rgba(255,255,255,0.04);
      border-radius: 12px; transition: border-color 0.2s;
    }
    .step:hover { border-color: rgba(99,102,241,0.2); }
    .step-num {
      width: 26px; height: 26px;
      background: rgba(99,102,241,0.15);
      border: 1px solid rgba(99,102,241,0.3);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700; color: var(--primary-light);
      flex-shrink: 0; font-family: var(--mono);
    }
    .step-text { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; padding-top: 3px; }
    .step-text strong { color: rgba(255,255,255,0.9); }
    .footer {
      text-align: center; margin-top: 20px;
      font-size: 12px; color: var(--muted);
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .footer span { color: var(--primary-light); font-weight: 600; }
    @media (max-width: 500px) {
      .card { padding: 28px 20px; }
      .code-value { font-size: 24px; letter-spacing: 5px; }
    }
  </style>
</head>
<body>

<div class="bg-mesh"></div>
<div class="scanlines"></div>

<div class="wrapper">
  <div style="display:flex;justify-content:center;">
    <div class="status-badge">
      <div class="status-dot"></div>
      System Online
    </div>
  </div>

  <div class="card">
    <div class="brand">
      <div class="brand-logo">⚡</div>
      <div class="brand-name">BILAL-MD</div>
      <div class="brand-desc">WhatsApp Bot — Multi Session Pairing</div>
    </div>

    <div class="divider"></div>

    <div class="field-label">
      <i class="fas fa-phone-alt"></i> Phone Number
    </div>

    <div class="input-group">
      <div class="input-prefix">+</div>
      <input type="tel" id="phone" placeholder="Country code + number (e.g. 12345678901)" autocomplete="off" maxlength="20">
    </div>

    <button class="btn-pair" id="btn-pair" onclick="requestCode()">
      <i class="fas fa-link"></i>
      Generate Pair Code
    </button>

    <div id="result-area"></div>

    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-text">Enter your number <strong>with country code</strong>, without the + sign</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-text">Click <strong>Generate Pair Code</strong> and copy the 8-digit code</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-text">Open WhatsApp → <strong>Linked Devices → Link with phone number</strong> → Paste code</div>
      </div>
    </div>
  </div>

  <div class="footer">
    Made with <i class="fas fa-heart" style="color:#ef4444;font-size:10px;margin:0 2px;"></i> by <span>BILAL KING</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.6.0/axios.min.js"></script>
<script>
  // Floating orbs
  ['#6366f1','#a855f7','#22d3ee','#10b981'].forEach((color, i) => {
    const orb = document.createElement('div');
    orb.className = 'orb';
    const s = 150 + i * 60;
    Object.assign(orb.style, {
      width: s+'px', height: s+'px', background: color,
      left: (10 + Math.random()*75)+'%',
      animationDuration: (20 + i*7)+'s',
      animationDelay: -(i*5)+'s'
    });
    document.body.appendChild(orb);
  });

  const resultArea = document.getElementById('result-area');
  const btn = document.getElementById('btn-pair');
  const phoneInput = document.getElementById('phone');
  let currentCode = '';

  phoneInput.addEventListener('keydown', e => { if (e.key === 'Enter') requestCode(); });

  async function requestCode() {
    const raw = phoneInput.value.replace(/[^0-9]/g, '');
    if (!raw) { showError('Please enter your WhatsApp phone number.'); return; }
    if (raw.length < 10) { showError('Number too short — include country code (e.g. 12345678901).'); return; }

    btn.classList.add('loading');
    btn.innerHTML = '<div class="spinner"></div> Connecting…';

    resultArea.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        Requesting pairing code for <strong style="color:#fff;margin-left:4px;">+${raw}</strong>…
      </div>`;

    try {
      const { data } = await axios.get('/code?number=' + raw);
      const code = data.code || 'UNAVAILABLE';
      currentCode = code;
      showCode(code);
    } catch (err) {
      showError('Failed to get pairing code. Server may be busy — please try again.');
    } finally {
      btn.classList.remove('loading');
      btn.innerHTML = '<i class="fas fa-redo"></i> Generate New Code';
    }
  }

  function showCode(code) {
    resultArea.innerHTML = `
      <div class="code-card">
        <div class="code-label"><i class="fas fa-key" style="color:var(--accent);margin-right:6px;"></i> Your Pairing Code</div>
        <span class="code-value">${code}</span>
        <button class="btn-copy" onclick="copyCode()">
          <i class="fas fa-copy" id="copyIcon"></i>
          <span id="copyText">Copy Code</span>
        </button>
        <div class="code-hint">
          <i class="fas fa-clock"></i>
          Enter this code in WhatsApp within 60 seconds.
        </div>
      </div>`;
  }

  function copyCode() {
    if (!currentCode) return;
    navigator.clipboard.writeText(currentCode).then(() => {
      document.getElementById('copyIcon').className = 'fas fa-check';
      document.getElementById('copyText').textContent = 'Copied!';
      setTimeout(() => {
        if (document.getElementById('copyIcon')) {
          document.getElementById('copyIcon').className = 'fas fa-copy';
          document.getElementById('copyText').textContent = 'Copy Code';
        }
      }, 2500);
    }).catch(() => {
      // Fallback
      const ta = document.createElement('textarea');
      ta.value = currentCode;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    });
  }

  function showError(msg) {
    resultArea.innerHTML = `
      <div class="error-state">
        <i class="fas fa-exclamation-circle" style="color:var(--danger);font-size:16px;flex-shrink:0;"></i>
        ${msg}
      </div>`;
  }
</script>
</body>
</html>
